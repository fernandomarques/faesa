<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Revisão Enade: árvores AVL e Dijkstra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&family=Atkinson+Hyperlegible+Next:ital,wght@0,400;0,600;0,700;1,400&family=Atkinson+Hyperlegible+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f4f7fb; --grid:#dfe6f1; --surface:#ffffff; --surface-2:#eaf0f8;
  --ink:#13223f; --muted:#5a6680; --line:#c9d3e3; --line-strong:#93a1bb;
  --avl:#0b7a6b; --avl-soft:#d4efe9; --dij:#5a3fcf; --dij-soft:#e6e0fb;
  --warn:#9a5b00; --warn-fill:#f5b72e; --warn-soft:#fdf0cc;
  --bad:#cf2c43; --bad-soft:#fbdde2; --good:#13814a; --good-soft:#d5f1e1;
  --on-accent:#ffffff;
  --display:"Archivo", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --body:"Atkinson Hyperlegible Next", "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --mono:"Atkinson Hyperlegible Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --accent:var(--ink); --accent-soft:var(--surface-2);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#111a2b; --grid:#1b2740; --surface:#17223a; --surface-2:#1f2c48;
    --ink:#e8eefa; --muted:#9aa8c3; --line:#2c3b5c; --line-strong:#4f6189;
    --avl:#38d3b6; --avl-soft:#11392f; --dij:#a693ff; --dij-soft:#2a2554;
    --warn:#ffcf5a; --warn-fill:#f5b72e; --warn-soft:#3b2f0e;
    --bad:#ff6d80; --bad-soft:#47202a; --good:#55d98f; --good-soft:#123a26;
    --on-accent:#0d1424;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#111a2b; --grid:#1b2740; --surface:#17223a; --surface-2:#1f2c48;
  --ink:#e8eefa; --muted:#9aa8c3; --line:#2c3b5c; --line-strong:#4f6189;
  --avl:#38d3b6; --avl-soft:#11392f; --dij:#a693ff; --dij-soft:#2a2554;
  --warn:#ffcf5a; --warn-fill:#f5b72e; --warn-soft:#3b2f0e;
  --bad:#ff6d80; --bad-soft:#47202a; --good:#55d98f; --good-soft:#123a26;
  --on-accent:#0d1424;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%; scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%; margin:0; background:var(--paper); color:var(--ink); font-family:var(--body); overflow:hidden; -webkit-font-smoothing:antialiased}
#viewport{position:relative; width:100%; height:100%; overflow:hidden}
#deck{
  position:absolute; left:50%; top:50%; width:1280px; height:720px;
  transform:translate(-50%,-50%) scale(var(--s,1)); transform-origin:center;
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size:32px 32px; background-position:-1px -1px;
  overflow:hidden;
}
#slide{position:absolute; inset:0 0 46px 0; padding:44px 64px 18px 76px; display:flex; flex-direction:column}
#slide::before{content:""; position:absolute; left:0; top:0; bottom:0; width:12px; background:var(--accent)}
#slide[data-sec="avl"]{--accent:var(--avl); --accent-soft:var(--avl-soft)}
#slide[data-sec="dij"]{--accent:var(--dij); --accent-soft:var(--dij-soft)}
#slide[data-sec="gen"]{--accent:var(--ink); --accent-soft:var(--surface-2)}
#slide.enter{animation:enter .28s ease-out}
@keyframes enter{from{opacity:0; transform:translateX(14px)}to{opacity:1; transform:none}}

h1,h2,h3{font-family:var(--display); margin:0; letter-spacing:-0.01em}
h2.t.sm{font-size:34px}
h2.t{font-size:42px; font-weight:800; font-stretch:82%; line-height:1.05; margin-bottom:24px; max-width:1080px}
h3{font-size:24px; font-weight:750; font-stretch:90%}
p{margin:0}
.lead{font-size:24px; line-height:1.4; color:var(--muted); max-width:820px}
.body{font-size:21px; line-height:1.45}
.small{font-size:16px; color:var(--muted); line-height:1.4}
ul.plain{list-style:none; padding:0; margin:0}
ul.plain li{position:relative; padding-left:24px; margin:0 0 10px; font-size:21px; line-height:1.4}
ul.plain li::before{content:""; position:absolute; left:2px; top:.6em; width:9px; height:9px; border-radius:2px; background:var(--accent)}
b,strong{font-weight:700}
code,.mono{font-family:var(--mono)}
.grow{flex:1; min-height:0}
.row{display:flex; gap:28px; align-items:stretch}
.cols{display:grid; grid-template-columns:1fr 1fr; gap:36px; flex:1; min-height:0}
.cols.wide-left{grid-template-columns:1.25fr 1fr}
.cols.wide-right{grid-template-columns:1fr 1.3fr}
.panel{background:var(--surface); border:1.5px solid var(--line); border-radius:14px; padding:22px 24px}
.panel.tint{background:var(--accent-soft); border-color:transparent}
.foot{margin-top:auto; font-size:21px; line-height:1.4; padding-top:16px}

/* cues de aprendizagem */
.cue{display:inline-flex; align-items:center; gap:7px; font-family:var(--body); font-weight:700; font-size:15px; padding:4px 11px 4px 9px; border-radius:999px; vertical-align:middle; white-space:nowrap}
.cue::before{content:""; width:9px; height:9px; border-radius:50%; background:currentColor}
.cue.prev{background:var(--warn-soft); color:var(--warn)}
.cue.rec{background:var(--avl-soft); color:var(--avl)}
.cue.vote{background:var(--dij-soft); color:var(--dij)}
.cue.pause{background:var(--good-soft); color:var(--good)}
.cue.err{background:var(--bad-soft); color:var(--bad)}
.ask{font-size:22px; line-height:1.4; margin:0 0 10px}
.ask .cue{margin-right:8px}

.mnemo{display:flex; gap:0; font-family:var(--display); font-stretch:78%; font-weight:850; font-size:30px; line-height:1}
.mnemo span{white-space:nowrap; padding:12px 20px; background:var(--accent); color:var(--on-accent)}
.mnemo span+span{border-left:3px solid var(--paper)}
.mnemo span:first-child{border-radius:10px 0 0 10px}
.mnemo span:last-child{border-radius:0 10px 10px 0}

/* fragmentos */
[data-s]{transition:opacity .25s ease, transform .25s ease}
[data-s]:not(.on){opacity:0; transform:translateY(6px); pointer-events:none}
[data-h].off{display:none}

/* capa */
.cover{display:grid; grid-template-columns:1.25fr 1fr; gap:24px; align-items:center; flex:1}
.cover h1{font-size:96px; line-height:.9; font-weight:900; font-stretch:72%; letter-spacing:-0.02em}
.cover h1 .l1{display:block; color:var(--avl)}
.cover h1 .l2{display:block; font-size:44px; font-weight:600; font-stretch:100%; margin:14px 0 10px; color:var(--muted); letter-spacing:0}
.cover h1 .l3{display:block; color:var(--dij)}
.cover .lead{margin-top:26px}
.cover .meta{margin-top:30px; display:flex; gap:12px; flex-wrap:wrap}
.tag{font-size:16px; padding:7px 14px; border-radius:8px; background:var(--surface); border:1.5px solid var(--line)}
.cover-art{display:grid; gap:10px}

/* números grandes */
.stat{display:flex; align-items:baseline; gap:12px; margin:10px 0 14px}
.stat .n{font-family:var(--display); font-weight:900; font-stretch:70%; font-size:112px; line-height:.85; color:var(--bad)}
.stat .u{font-size:20px; color:var(--muted)}
.qtag{font-size:16px; color:var(--muted)}

/* princípios */
.princ{display:grid; grid-template-columns:repeat(4,1fr); gap:18px}
.princ .panel{padding:20px}
.princ h3{font-size:23px; margin:10px 0 8px}
.princ p{font-size:17.5px; line-height:1.42; color:var(--muted)}
.answer{margin-top:auto; align-self:stretch; padding-top:18px; border-top:1.5px dashed var(--line-strong); display:flex; justify-content:space-between; font-size:19px; color:var(--muted)}
.vote-strip{margin-top:22px; display:flex; gap:22px; align-items:center; padding:16px 22px; border-radius:14px; background:var(--dij-soft); font-size:20px}
.hand{font-family:var(--display); font-weight:850; font-size:30px; font-stretch:80%; color:var(--dij)}

/* roteiro */
.plan{display:grid; grid-template-columns:110px 1fr 520px; row-gap:9px; column-gap:22px; align-items:center; font-size:19px}
.plan .tm{font-family:var(--mono); font-weight:600; color:var(--muted); text-align:right}
.plan .bar{height:26px; border-radius:6px; position:relative}
.plan .bar i{position:absolute; top:0; bottom:0; border-radius:6px}
.plan .lbl{line-height:1.25}
.plan .lbl em{font-style:normal; color:var(--muted); font-size:16px}

/* divisor de seção */
.divider{display:grid; grid-template-columns:1fr 1fr; gap:30px; align-items:center; flex:1}
.divider .big{font-family:var(--display); font-size:150px; font-weight:900; font-stretch:68%; line-height:.82; color:var(--accent); letter-spacing:-0.02em}
.divider .sub{font-size:24px; color:var(--muted); margin:18px 0 30px; max-width:520px; line-height:1.4}

/* árvores e grafos */
svg{display:block}
svg text{text-anchor:middle; dominant-baseline:central}
.tree{width:100%; height:auto}
.tree text{font-family:var(--mono); font-weight:700; fill:var(--ink); font-size:var(--fs)}
.t-edge{stroke:var(--line-strong); stroke-width:2.2}
.t-edge.e-moved{stroke:var(--avl); stroke-width:3.2; stroke-dasharray:7 5}
.t-node circle{fill:var(--surface); stroke:var(--ink); stroke-width:2.2}
.t-node.n-new circle{fill:var(--warn-fill); stroke:var(--warn-fill)}
.t-node.n-new text{fill:#13223f}
.t-node.n-bad circle{fill:var(--bad-soft); stroke:var(--bad); stroke-width:3}
.t-node.n-pivot circle{fill:var(--bad); stroke:var(--bad)}
.t-node.n-pivot text{fill:var(--on-accent)}
.t-node.n-hl circle{fill:var(--avl); stroke:var(--avl)}
.t-node.n-hl text{fill:var(--on-accent)}
.t-node.n-moved circle,.t-node.n-moved polygon{fill:var(--avl-soft); stroke:var(--avl); stroke-width:3}
.t-node.n-dim{opacity:.32}
.t-node.tri polygon{fill:var(--surface-2); stroke:var(--line-strong); stroke-width:1.6}
.t-node.tri text{font-family:var(--body); font-weight:600}
.t-node.tri .t-h{font-family:var(--body); font-weight:700; font-size:var(--fs2); fill:var(--muted)}
.t-node.n-new.n-moved circle{fill:var(--warn-fill); stroke:var(--avl); stroke-width:3.5; stroke-dasharray:5 3}
.tree .t-node.n-new .t-tag{font-family:var(--body); font-weight:700; font-size:var(--fs2); fill:var(--warn)}
.legend{display:flex; gap:26px; flex-wrap:wrap; font-size:16px; color:var(--muted); margin-bottom:4px}
.legend span{display:inline-flex; align-items:center; gap:8px}
.legend i{width:17px; height:17px; border-radius:50%; border:2.5px solid; display:inline-block}
.lg-new{background:var(--warn-fill); border-color:var(--warn-fill)}
.lg-piv{background:var(--bad); border-color:var(--bad)}
.lg-up{background:var(--avl); border-color:var(--avl)}
.lg-mv{background:var(--avl-soft); border-color:var(--avl); border-style:dashed !important}
.rot-row{display:flex; align-items:flex-start; gap:6px; margin-top:8px}
.rot-col{flex:1; min-width:0; display:flex; flex-direction:column; gap:4px}
.rot-col .cap{font-size:17px; line-height:1.35; text-align:center; padding:0 4px}
.rot-arrow{flex:0 0 64px; align-self:center; margin-top:-50px; text-align:center; font-family:var(--display); font-weight:850; font-stretch:85%; font-size:18px; line-height:1.1; color:var(--avl)}
.rot-arrow::after{content:"→"; display:block; font-size:30px; margin-top:4px}
.t-fb rect{fill:var(--surface-2); stroke:var(--line-strong); stroke-width:1}
.t-fb text{font-size:var(--fs2); fill:var(--muted)}
.t-fb.bad rect{fill:var(--bad); stroke:var(--bad)}
.t-fb.bad text{fill:var(--on-accent)}

.graph{width:100%; height:auto; max-height:100%}
.g-edge{fill:none; stroke:var(--line-strong); stroke-width:2.2}
.g-edge.s-up{stroke:var(--good); stroke-width:4}
.g-edge.s-no{stroke:var(--muted); stroke-width:2; stroke-dasharray:6 5}
.g-edge.s-closed{stroke:var(--bad); stroke-width:2.5; stroke-dasharray:6 5}
.ah-base{fill:var(--line-strong)} .ah-up{fill:var(--good)} .ah-no{fill:var(--muted)} .ah-closed{fill:var(--bad)}
.g-w rect{fill:var(--surface); stroke:var(--line); stroke-width:1}
.g-w text{font-family:var(--mono); font-weight:700; font-size:15px; fill:var(--ink)}
.g-w.s-up rect{fill:var(--good-soft); stroke:var(--good)}
.g-w.neg text{fill:var(--bad)}
.g-node circle{fill:var(--surface); stroke:var(--ink); stroke-width:2.2}
.g-node .nm{font-family:var(--display); font-weight:800; font-size:20px; fill:var(--ink)}
.g-node.closed circle{fill:var(--dij); stroke:var(--dij)}
.g-node.closed .nm{fill:var(--on-accent)}
.g-node.current circle{stroke:var(--warn-fill); stroke-width:6}
.g-node.ask circle{stroke:var(--warn-fill); stroke-width:4; animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{stroke-width:7}}
.dist rect{fill:var(--surface-2); stroke:var(--line-strong); stroke-width:1}
.dist text{font-family:var(--mono); font-weight:700; font-size:15px; fill:var(--ink)}
.dist.chg rect{fill:var(--good-soft); stroke:var(--good); stroke-width:1.5}
.dist.chg text{fill:var(--good)}

/* stepper do Dijkstra */
.stepper{display:grid; grid-template-columns:1.4fr 1fr; gap:30px; flex:1; min-height:0}
.sp-graph{display:flex; align-items:flex-start; min-height:0}
.sp-side{display:flex; flex-direction:column; gap:12px; min-height:0}
.sp-text{font-size:19.5px; line-height:1.4; min-height:132px}
.sp-text ul{list-style:none; padding:0; margin:8px 0 0}
.sp-text li{font-family:var(--mono); font-size:16.5px; padding:3px 0 3px 22px; position:relative}
.sp-text li::before{content:""; position:absolute; left:3px; top:11px; width:12px; height:3px; border-radius:2px; background:var(--muted)}
.sp-text li.up::before{background:var(--good)} .sp-text li.closed::before{background:var(--bad)}
.sp-text li.closed{color:var(--bad)}
.sp-note{font-size:17.5px; line-height:1.35; padding:10px 14px; border-radius:10px; background:var(--warn-soft); color:var(--ink); border-left:5px solid var(--warn-fill)}
.sp-note:empty{display:none}
.queue{display:flex; gap:8px; flex-wrap:wrap; margin:8px 0}
.queue span{font-family:var(--mono); font-weight:700; font-size:18px; padding:5px 12px; border-radius:8px; background:var(--surface); border:2px solid var(--warn-fill)}
table.dt{border-collapse:collapse; width:100%; font-family:var(--mono); font-size:17px; background:var(--surface); border-radius:10px; overflow:hidden}
table.dt th{font-family:var(--body); font-weight:700; font-size:15px; color:var(--muted); background:var(--surface-2); padding:6px 4px}
table.dt td{text-align:center; padding:5px 4px; border-top:1px solid var(--line)}
table.dt td.it{color:var(--muted)}
table.dt td.out{font-weight:700; color:var(--dij)}
table.dt td.cl{color:var(--dij); font-weight:700}
table.dt td.chg{background:var(--good-soft); color:var(--good); font-weight:700}
table.dt tr.cur td{border-top:2px solid var(--dij)}

/* tabelas genéricas */
table.rule{border-collapse:separate; border-spacing:0; width:100%; font-size:20px; background:var(--surface); border:1.5px solid var(--line); border-radius:14px; overflow:hidden}
table.rule th{text-align:left; font-size:16px; color:var(--muted); font-weight:700; padding:12px 18px; background:var(--surface-2)}
table.rule td{padding:12px 18px; border-top:1px solid var(--line)}
table.rule td.sg{font-family:var(--mono); font-weight:700; font-size:20px; white-space:nowrap}
.pos{color:var(--avl)} .neg{color:var(--bad)}
.qmark{color:var(--muted); font-family:var(--display); font-weight:800; font-size:24px}

pre.code{align-self:start; margin:0; font-family:var(--mono); font-size:18px; line-height:1.6; background:var(--surface); border:1.5px solid var(--line); border-radius:14px; padding:20px 22px; white-space:pre}
pre.code .k{color:var(--dij); font-weight:700}
pre.code .c{color:var(--muted)}
pre.code mark{background:var(--dij-soft); color:inherit; border-radius:4px; padding:1px 4px}

/* prática */
.qgrid{display:grid; grid-template-columns:repeat(4,1fr); gap:16px; flex:1; min-height:0}
.qcard{background:var(--surface); border:1.5px solid var(--line); border-radius:14px; padding:14px 16px; display:flex; flex-direction:column; gap:8px}
.qcard h3{font-size:21px}
.qcard p{font-size:17px; line-height:1.35}
.qcard .tree{margin:auto 0}
.seq{font-family:var(--mono); font-weight:700; font-size:22px; letter-spacing:.02em; margin:auto 0; text-align:center; padding:14px 0; border-radius:10px; background:var(--surface-2)}
.practice-top{display:flex; align-items:center; justify-content:space-between; gap:24px; margin-bottom:16px}
.protocol{font-size:19px; line-height:1.4; max-width:760px}

.timer{font-family:var(--mono); font-weight:700; font-size:54px; line-height:1; padding:12px 22px; border-radius:14px; background:var(--surface); border:2px solid var(--line-strong); cursor:pointer; user-select:none; min-width:220px; text-align:center}
.timer small{display:block; font-family:var(--body); font-size:13px; font-weight:600; color:var(--muted); margin-top:6px}
.timer.run{border-color:var(--accent)}
.timer.warn{color:var(--warn); border-color:var(--warn-fill)}
.timer.done{color:var(--bad); border-color:var(--bad); animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.45}}

/* correção */
.corr{display:grid; grid-template-columns:1fr 1fr; gap:30px; flex:1; min-height:0}
.corr .panel{display:flex; flex-direction:column; gap:10px; padding:18px 22px}
.corr h3 .ans{color:var(--accent)}
.corr p{font-size:18.5px; line-height:1.4}
.corr .distr{font-size:16px; color:var(--muted)}
.chips{display:flex; flex-wrap:wrap; gap:8px}
.chips span{font-size:15.5px; padding:5px 10px; border-radius:8px; background:var(--surface-2)}

/* regras e listas numeradas (são sequência) */
.rules{display:grid; grid-template-columns:1fr 1fr; gap:14px 30px; counter-reset:r}
.rules > div{display:grid; grid-template-columns:48px 1fr; gap:14px; align-items:start; font-size:20px; line-height:1.38; padding:12px 16px; background:var(--surface); border:1.5px solid var(--line); border-radius:12px}
.rules > div::before{counter-increment:r; content:counter(r); font-family:var(--display); font-weight:900; font-size:38px; font-stretch:70%; line-height:1; color:var(--accent)}

.flash{display:grid; grid-template-columns:repeat(3,1fr); gap:16px; flex:1; min-height:0}
.flash .panel{display:flex; flex-direction:column; gap:12px; padding:18px 20px}
.flash .q{font-size:19.5px; line-height:1.38}
.flash .a{margin-top:auto; font-size:18.5px; line-height:1.35; font-weight:700; padding:10px 12px; border-radius:10px}
.flash .a.av{background:var(--avl-soft); color:var(--avl)}
.flash .a.dj{background:var(--dij-soft); color:var(--dij)}
.flash .topic{font-size:14px; font-weight:700}
.flash .topic.av{color:var(--avl)} .flash .topic.dj{color:var(--dij)}

.check{display:grid; grid-template-columns:1fr 1fr; gap:30px; flex:1}
.check .panel{padding:24px 28px}
.check h3{font-size:34px; font-stretch:78%; margin-bottom:16px}
.check ol{margin:0; padding-left:30px; font-size:25px; line-height:1.8}
.check .av h3{color:var(--avl)} .check .dj h3{color:var(--dij)}

.verdict{font-weight:700; padding:2px 10px; border-radius:6px; font-size:17px; margin-left:8px}
.verdict.ok{background:var(--good-soft); color:var(--good)}
.verdict.no{background:var(--bad-soft); color:var(--bad)}
.afirm{display:flex; flex-direction:column; gap:14px}
.afirm > div{font-size:21px; line-height:1.4; padding:14px 18px; background:var(--surface); border:1.5px solid var(--line); border-radius:12px}

.final{flex:1; display:flex; flex-direction:column; justify-content:center}
.final h1{font-size:150px; font-weight:900; font-stretch:68%; line-height:.85; letter-spacing:-0.02em}
.final p{font-size:26px; line-height:1.4; color:var(--muted); margin-top:26px; max-width:860px}

/* barra inferior */

<div id="viewport">

    </div>

<script>
(() => {
"use strict";
const MINUS = "\u2212";
const fmt = v => v === Infinity ? "∞" : (v < 0 ? MINUS + Math.abs(v) : String(v));
const fmtFB = f => f > 0 ? "+" + f : (f < 0 ? MINUS + Math.abs(f) : "0");

/* ---------------- árvores ---------------- */
function build(spec, cls = {}, fbm = {}, hm = {}) {
  if (spec === null || spec === undefined) return null;
  if (!Array.isArray(spec)) spec = [spec];
  const [k, l = null, r = null] = spec;
  const n = { k, l: build(l, cls, fbm, hm), r: build(r, cls, fbm, hm) };
  if (/^T\d$/.test(String(k))) n.tri = true;
  if (cls[k]) n.c = cls[k];
  if (fbm[k] !== undefined) n.fb = fbm[k];
  if (hm[k]) n.h = hm[k];
  return n;
}
const hgt = n => n ? 1 + Math.max(hgt(n.l), hgt(n.r)) : 0;
const fbOf = n => hgt(n.l) - hgt(n.r);

function treeSVG(root, o = {}) {
  const W = o.w || 520, H = o.h || 300, R = o.r || 19;
  const padX = R + 14, top = R * 1.9 + 4;
  const nodes = []; let idx = 0, maxD = 0;
  (function walk(n, d) { if (!n) return; walk(n.l, d + 1); n._x = idx++; n._d = d; if (d > maxD) maxD = d; nodes.push(n); walk(n.r, d + 1); })(root, 0);
  const hasTri = nodes.some(n => n.tri);
  const bottom = H - R - 8 - (hasTri ? R * (nodes.some(n => n.h) ? 1.3 : 0.5) : 0) - (o.tagNew ? 16 : 0);
  const sx = (W - 2 * padX) / idx, sy = maxD ? (bottom - top) / maxD : 0;
  for (const n of nodes) { n._px = padX + (n._x + 0.5) * sx; n._py = top + n._d * sy; }
  let e = "", b = "";
  for (const n of nodes) for (const c of [n.l, n.r]) if (c) {
    e += `<line class="t-edge${/\bmoved\b/.test(c.c || "") ? " e-moved" : ""}" x1="${n._px}" y1="${n._py}" x2="${c._px}" y2="${c._py - (c.tri ? R * 0.6 : 0)}"/>`;
  }
  for (const n of nodes) {
    const cls = "t-node" + (n.c ? n.c.split(" ").map(x => " n-" + x).join("") : "") + (n.tri ? " tri" : "");
    const x = n._px, y = n._py;
    if (n.tri) {
      b += `<g class="${cls}"><polygon points="${x},${y - R * 0.6} ${x - R * 1.2},${y + R * 1.4} ${x + R * 1.2},${y + R * 1.4}"/><text x="${x}" y="${y + R * 0.72}">${n.k}</text>${n.h ? `<text class="t-h" x="${x}" y="${y + R * 2.05}">${n.h}</text>` : ""}</g>`;
    } else {
      b += `<g class="${cls}"><circle cx="${x}" cy="${y}" r="${R}"/><text x="${x}" y="${y + 0.5}">${n.k}</text>${o.tagNew && /\bnew\b/.test(n.c || "") ? `<text class="t-tag" x="${x}" y="${y + R + 11}">novo</text>` : ""}</g>`;
    }
    const show = n.fb !== undefined || (o.fb && !n.tri);
    if (show) {
      const f = n.fb !== undefined ? n.fb : fbOf(n);
      const bw = R * 1.62, bh = R * 1.02, bx = x + R * 0.78, by = y - R * 1.28;
      b += `<g class="t-fb${Math.abs(f) >= 2 ? " bad" : ""}"><rect x="${bx - bw / 2}" y="${by - bh / 2}" width="${bw}" height="${bh}" rx="${bh / 2}"/><text x="${bx}" y="${by + 0.5}">${fmtFB(f)}</text></g>`;
    }
  }
  return `<svg class="tree" viewBox="0 0 ${W} ${H}" style="--fs:${(R * 0.9).toFixed(1)}px;--fs2:${(R * 0.66).toFixed(1)}px" role="img" aria-label="${o.label || "árvore"}">${e}${b}</svg>`;
}

/* ---------------- grafos e Dijkstra ---------------- */
let uid = 0;
function graphSVG(g, st = {}, o = {}) {
  const [W, H] = g.size, R = 23, id = "m" + (++uid);
  const rel = {};
  (st.rel || []).forEach(r => { rel[st.cur + ">" + r.v] = r.status; });
  const defs = ["base", "up", "no", "closed"].map(k => `<marker id="${id}-${k}" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path class="ah ah-${k}" d="M0,0 L10,5 L0,10 z"/></marker>`).join("");
  let e = "", lab = "", nd = "";
  for (const [u, v, w, bend = 0] of g.edges) {
    const [x1, y1] = g.pos[u], [x2, y2] = g.pos[v];
    const status = rel[u + ">" + v] || "base";
    let d, mx, my;
    if (!bend) {
      const dx = x2 - x1, dy = y2 - y1, L = Math.hypot(dx, dy), ux = dx / L, uy = dy / L;
      d = `M${x1 + ux * R},${y1 + uy * R} L${x2 - ux * (R + 2)},${y2 - uy * (R + 2)}`;
      mx = (x1 + x2) / 2; my = (y1 + y2) / 2;
    } else {
      const dx = x2 - x1, dy = y2 - y1, L = Math.hypot(dx, dy), nx = -dy / L, ny = dx / L;
      const cx = (x1 + x2) / 2 + nx * bend, cy = (y1 + y2) / 2 + ny * bend;
      const a1x = cx - x1, a1y = cy - y1, l1 = Math.hypot(a1x, a1y), a2x = x2 - cx, a2y = y2 - cy, l2 = Math.hypot(a2x, a2y);
      d = `M${x1 + a1x / l1 * R},${y1 + a1y / l1 * R} Q${cx},${cy} ${x2 - a2x / l2 * (R + 2)},${y2 - a2y / l2 * (R + 2)}`;
      mx = 0.25 * x1 + 0.5 * cx + 0.25 * x2; my = 0.25 * y1 + 0.5 * cy + 0.25 * y2;
    }
    e += `<path class="g-edge s-${status}" d="${d}" marker-end="url(#${id}-${status})"/>`;
    const wt = fmt(w), tw = 14 + wt.length * 9.5;
    lab += `<g class="g-w s-${status}${w < 0 ? " neg" : ""}"><rect x="${mx - tw / 2}" y="${my - 11}" width="${tw}" height="22" rx="6"/><text x="${mx}" y="${my + 0.5}">${wt}</text></g>`;
  }
  for (const v of Object.keys(g.pos)) {
    const [x, y, lp = "b"] = g.pos[v];
    const closed = (st.closed || []).includes(v);
    let cls = "g-node";
    if (closed) cls += " closed";
    if (st.cur === v) cls += " current";
    if (st.ask && !closed) cls += " ask";
    let dist = "";
    if (st.dist) {
      const px = x, py = lp === "t" ? y - R - 17 : y + R + 17;
      const chg = (st.changed || []).includes(v);
      dist = `<g class="dist${chg ? " chg" : ""}"><rect x="${px - 22}" y="${py - 11}" width="44" height="22" rx="11"/><text x="${px}" y="${py + 0.5}">${fmt(st.dist[v])}</text></g>`;
    }
    nd += `<g class="${cls}"><circle cx="${x}" cy="${y}" r="${R}"/><text class="nm" x="${x}" y="${y + 0.5}">${v}</text>${dist}</g>`;
  }
  return `<svg class="graph" viewBox="0 0 ${W} ${H}" role="img" aria-label="${o.label || "grafo"}"><defs>${defs}</defs>${e}${lab}${nd}</svg>`;
}

function runDijkstra(g) {
  const V = g.order, dist = {}, closed = [];
  V.forEach(v => dist[v] = Infinity);
  dist[g.src] = 0;
  const states = [{ iter: 0, dist: { ...dist }, closed: [], cur: null, rel: [], changed: [g.src] }];
  let k = 0;
  while (closed.length < V.length) {
    let u = null;
    for (const v of V) if (!closed.includes(v) && (u === null || dist[v] < dist[u])) u = v;
    if (dist[u] === Infinity) break;
    k++; closed.push(u);
    const rel = [], changed = [];
    for (const [a, b, w] of g.edges) if (a === u) {
      const cand = dist[u] + w, old = dist[b];
      if (closed.includes(b)) rel.push({ v: b, w, cand, old, status: "closed" });
      else if (cand < old) { dist[b] = cand; changed.push(b); rel.push({ v: b, w, cand, old, status: "up" }); }
      else rel.push({ v: b, w, cand, old, status: "no" });
    }
    states.push({ iter: k, dist: { ...dist }, closed: [...closed], cur: u, du: dist[u], rel, changed });
  }
  return states;
}

function stateText(g, st) {
  if (st.iter === 0) return `<p><b>Linha 0 (inicialização):</b> ${g.src} = 0; os demais, ∞. Ainda não é uma iteração.</p>`;
  let h = `<p><b>Iteração ${st.iter}:</b> retira <b>${st.cur}</b> (${fmt(st.du)}), o menor de toda a fila.</p><ul>`;
  if (!st.rel.length) h += `<li>${st.cur} não tem arcos de saída.</li>`;
  for (const r of st.rel) {
    const expr = `${fmt(st.du)} ${r.w < 0 ? MINUS : "+"} ${Math.abs(r.w)} = ${fmt(r.cand)}`;
    if (r.status === "up") h += `<li class="up">${st.cur}→${r.v}: ${expr} &lt; ${fmt(r.old)} ⇒ <b>${r.v} = ${fmt(r.cand)}</b></li>`;
    else if (r.status === "no") h += `<li>${st.cur}→${r.v}: ${expr}, não melhora o ${fmt(r.old)}</li>`;
    else if (r.cand < r.old) h += `<li class="closed">${st.cur}→${r.v}: ${expr} &lt; ${fmt(r.old)}… mas ${r.v} já saiu da fila</li>`;
    else h += `<li>${st.cur}→${r.v}: ${r.v} já saiu da fila (definitivo)</li>`;
  }
  return h + "</ul>";
}

function tableHTML(g, states, upto) {
  let h = `<table class="dt"><thead><tr><th>it.</th><th>retira</th>${g.order.map(v => `<th>${v}</th>`).join("")}</tr></thead><tbody>`;
  for (let i = 0; i <= upto; i++) {
    const st = states[i];
    h += `<tr class="${i === upto ? "cur" : ""}"><td class="it">${i}</td><td class="out">${st.cur || "—"}</td>`;
    for (const v of g.order) {
      let c = "";
      if (st.changed.includes(v)) c = "chg"; else if (st.closed.includes(v)) c = "cl";
      h += `<td class="${c}">${fmt(st.dist[v])}</td>`;
    }
    h += "</tr>";
  }
  return h + "</tbody></table>";
}

function stepper(g, o = {}) {
  const states = runDijkstra(g);
  const seq = [{ i: 0 }];
  for (let i = 1; i < states.length; i++) {
    if (o.predict) seq.push({ i: i - 1, ask: true, next: i });
    seq.push({ i });
  }
  return {
    steps: seq.length - 1,
    html: `<div class="stepper"><div class="sp-graph"></div><div class="sp-side"><div class="sp-text"></div><div class="sp-note"></div><div class="sp-table"></div></div></div>`,
    update(step, root) {
      const s = seq[step], st = states[s.i];
      const view = s.ask ? { dist: st.dist, closed: st.closed, ask: true } : st;
      root.querySelector(".sp-graph").innerHTML = graphSVG(g, view, { label: o.label });
      let txt;
      if (s.ask) {
        const q = g.order.filter(v => !st.closed.includes(v)).map(v => `<span>${v} = ${fmt(st.dist[v])}</span>`).join("");
        txt = `<p class="ask"><span class="cue prev">Preveja</span>Quem sai na iteração ${states[s.next].iter}?</p><div class="queue">${q}</div><p class="small">Mostre com a mão: aponte para o vértice no quadro. Só depois clique.</p>`;
      } else txt = stateText(g, st);
      root.querySelector(".sp-text").innerHTML = txt;
      root.querySelector(".sp-note").innerHTML = (!s.ask && o.notes && o.notes[st.iter]) || "";
      root.querySelector(".sp-table").innerHTML = tableHTML(g, states, s.i);
    }
  };
}

/* grafos usados na aula */
const G_SIM = {
  size: [700, 400], src: "D", order: ["A", "B", "C", "D", "E", "F", "G"],
  pos: { D: [70, 200, "b"], A: [220, 70, "t"], B: [480, 70, "t"], C: [630, 200, "b"], E: [360, 200, "t"], F: [220, 335, "b"], G: [480, 335, "b"] },
  edges: [["D", "A", 5], ["D", "B", 9], ["D", "E", 5], ["D", "F", 1], ["A", "B", 2], ["B", "C", 8], ["E", "B", 1], ["E", "C", 5], ["F", "E", 3], ["F", "G", 1], ["G", "E", 1]]
};
const G_LIST = {
  size: [760, 400], src: "S", order: ["S", "A", "B", "C", "D", "T"],
  pos: { S: [60, 200, "b"], A: [330, 60, "t"], B: [215, 200, "b"], C: [330, 340, "b"], D: [460, 200, "b"], T: [700, 200, "b"] },
  edges: [["S", "A", 7], ["S", "B", 2], ["S", "C", 6], ["B", "A", 4], ["B", "C", 3], ["B", "D", 9], ["C", "D", 4], ["C", "T", 10], ["A", "D", 2], ["A", "T", 5], ["D", "T", 1]]
};
const G_NEG = {
  size: [560, 300], src: "S", order: ["S", "A", "B", "C"],
  pos: { S: [70, 150, "b"], A: [280, 62, "t"], B: [280, 238, "b"], C: [490, 62, "t"] },
  edges: [["S", "A", 2], ["S", "B", 5], ["A", "C", 1], ["B", "A", -4]]
};

/* árvores usadas na aula */
const SIM_BEFORE = [13, [10, [5, 4, 8], 11], [15, null, 16]];
const SIM_INS = [13, [10, [5, [4, 3], 8], 11], [15, null, 16]];
const SIM_AFTER = [13, [5, [4, 3], [10, 8, 11]], [15, null, 16]];
const Q1_BEFORE = [50, [30, [20, 10], 40], [70, 60, [80, null, 90]]];
const Q1_INS = [50, [30, [20, [10, 5]], 40], [70, 60, [80, null, 90]]];
const Q1_AFTER = [50, [30, [10, 5, 20], 40], [70, 60, [80, null, 90]]];
const Q2_BEFORE = [20, 10, [30, 25, 40]];
const Q2_INS = [20, 10, [30, 25, [40, null, 50]]];
const Q2_AFTER = [30, [20, 10, 25], [40, null, 50]];
const Q3_BEFORE = [50, [30, 20, 40], 70];
const Q3_INS = [50, [30, 20, [40, 35]], 70];
const Q3_AFTER = [40, [30, 20, 35], [50, null, 70]];
const Q4_AFTER = [30, [20, 10, 25], [40, null, 50]];
const Q4_BST = [10, null, [20, null, [30, 25, [40, null, 50]]]];

/* ---------------- slides ---------------- */
const SLIDES = [];
const add = s => SLIDES.push(s);

// 1 · capa
add({
  sec: "gen", min: 0, title: "Capa",
  html: `<div class="cover">
    <div>
      <h1><span class="l1">Árvores AVL</span><span class="l2">e o algoritmo de</span><span class="l3">Dijkstra</span></h1>
      <p class="lead">Revisão para o Enade de Ciência da Computação. Duas questões que a turma errou no 2º simulado, e um procedimento curto para não errar de novo.</p>
      <div class="meta"><span class="tag">80 minutos</span><span class="tag">8 questões</span><span class="tag">Papel e caneta na mesa</span></div>
    </div>
    <div class="cover-art">
      ${treeSVG(build(SIM_AFTER, { 5: "hl", 3: "new" }), { w: 460, h: 230, r: 17, fb: true, label: "árvore AVL" })}
      ${graphSVG(G_SIM, runDijkstra(G_SIM)[7], { label: "grafo do Dijkstra" })}
    </div>
  </div>`,
  notes: `<p>Antes de começar: celulares fechados, papel e caneta na mesa. Avise que vão votar com os dedos várias vezes.</p><p>Teclas: → avança, ← volta, N abre estas notas, T liga o cronômetro das atividades, F tela cheia, M lista de slides.</p>`
});

// 2 · por que
add({
  sec: "gen", min: 1, title: "Por que esta aula", steps: 1,
  html: `<h2 class="t">Vocês conhecem os dois algoritmos. O erro foi parar cedo ou mexer no lugar errado.</h2>

// 3 · como vamos estudar
add({
  sec: "gen", min: 2, title: "Como vamos estudar hoje",
  html: `<h2 class="t">Hoje vocês vão errar de propósito, e isso é o que faz lembrar.</h2>
  <div class="princ">
    <div class="panel"><span class="cue prev">Preveja</span><h3>Responda antes de ver</h3><p>Errar uma previsão e ver a correção logo em seguida fixa mais do que só assistir. Quanto mais confiante o erro, mais forte a correção.</p></div>
    <div class="panel"><span class="cue rec">Recupere</span><h3>Puxe da memória</h3><p>Lembrar sem olhar fortalece a memória muito mais do que reler o slide. Vai parecer difícil: é esse o esforço que funciona.</p></div>
    <div class="panel"><span class="cue vote">Vote</span><h3>Explique ao colega</h3><p>Ao discutir com quem votou diferente, vocês precisam pôr o raciocínio em palavras, e isso revela o que ainda está frágil.</p></div>

d[s] ← 0;  d[v] ← ∞ para os demais

  html: `<div class="final">
    <h1><span style="color:var(--avl)">Bom</span> <span style="color:var(--dij)">Enade!</span></h1>
    <p>As duas questões do simulado vieram de provas do Enade. O mesmo tipo de questão pode cair de novo, e agora vocês têm o procedimento.</p>
  </div>`,
  notes: `<p>Fim. Se sobrar tempo, refaça a votação do aquecimento para ver quantos mudaram de resposta.</p>`
});

/* ---------------- motor da apresentação ---------------- */
const slideEl = document.getElementById("slide");
const notesEl = document.getElementById("notes");
const menuEl = document.getElementById("menu");
const deck = document.getElementById("deck");
const SEC = { gen: ["Geral", "var(--ink)"], avl: ["Árvore AVL", "var(--avl)"], dij: ["Dijkstra", "var(--dij)"] };
let cur = 0, step = 0;
const timers = {};
let classStart = null;

function fit() {
  const vp = document.getElementById("viewport");
  const s = Math.min(vp.clientWidth / 1280, vp.clientHeight / 720);
  deck.style.setProperty("--s", s);
}

function render(animate = true) {
  const sl = SLIDES[cur];
  slideEl.dataset.sec = sl.sec;
  slideEl.innerHTML = sl.html;
  slideEl.classList.remove("enter");
  if (animate) { void slideEl.offsetWidth; slideEl.classList.add("enter"); }
  const [name, col] = SEC[sl.sec];
  document.getElementById("secname").textContent = name;
  document.querySelector("#hud .sec i").style.background = col;
  document.getElementById("ttl").textContent = sl.title;
  document.getElementById("num").textContent = `${cur + 1} / ${SLIDES.length}`;
  const pi = document.querySelector("#prog i");
  pi.style.width = ((cur + 1) / SLIDES.length * 100) + "%";
  pi.style.background = col;
  notesEl.innerHTML = `<h4>${sl.title}</h4><div class="when">planejado: minuto ${sl.min} de 80</div>${sl.notes || ""}`;
  const t = slideEl.querySelector(".timer");
  if (t) {
    if (!timers[cur]) timers[cur] = { total: sl.timer, left: sl.timer, run: false, id: null };
    t.addEventListener("click", ev => { ev.stopPropagation(); toggleTimer(); });
    t.addEventListener("keydown", ev => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); ev.stopPropagation(); toggleTimer(); } });
    drawTimer();
  }
  apply();
  if (location.hash !== "#s" + (cur + 1)) history.replaceState(null, "", "#s" + (cur + 1));
  [...menuEl.querySelectorAll("button")].forEach((b, i) => b.classList.toggle("cur", i === cur));
}

function apply() {
  const sl = SLIDES[cur];
  slideEl.querySelectorAll("[data-s]").forEach(el => el.classList.toggle("on", step >= +el.dataset.s));
  slideEl.querySelectorAll("[data-h]").forEach(el => el.classList.toggle("off", step >= +el.dataset.h));
  if (sl.update) sl.update(step, slideEl);
}

function next() {
  const max = SLIDES[cur].steps || 0;
  startClock();
  if (step < max) { step++; apply(); }
  else if (cur < SLIDES.length - 1) { cur++; step = 0; render(); }
}
function prev() {
  if (step > 0) { step--; apply(); }
  else if (cur > 0) { cur--; step = SLIDES[cur].steps || 0; render(); }
}
function go(i) { cur = Math.max(0, Math.min(SLIDES.length - 1, i)); step = 0; render(); }

/* cronômetros das atividades */
const mmss = s => String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
function drawTimer() {
  const t = slideEl.querySelector(".timer"), st = timers[cur];
  if (!t || !st) return;
  const hint = st.left === 0 ? "tempo esgotado · R reinicia" : st.run ? "rodando · clique para pausar" : (st.left === st.total ? "clique ou T para iniciar" : "pausado · clique para continuar");
  t.innerHTML = `${mmss(st.left)}<small>${hint}</small>`;
  t.classList.toggle("run", st.run);
  t.classList.toggle("warn", st.left > 0 && st.left <= 60);
  t.classList.toggle("done", st.left === 0);
}
function toggleTimer() {
  const st = timers[cur]; if (!st) return;
  if (st.left === 0) return resetTimer();
  st.run = !st.run;
  if (st.run) {
    const owner = cur;
    st.id = setInterval(() => {
      st.left = Math.max(0, st.left - 1);
      if (st.left === 0) { st.run = false; clearInterval(st.id); }
      if (cur === owner) drawTimer();
    }, 1000);
  } else clearInterval(st.id);
  drawTimer();
}
function resetTimer() {
  const st = timers[cur]; if (!st) return;
  clearInterval(st.id); st.run = false; st.left = st.total; drawTimer();
}

/* relógio da aula */
function startClock() { if (classStart === null) classStart = Date.now(); }
setInterval(() => {
  const c = document.getElementById("clock");
  if (classStart === null) { c.textContent = "00:00"; c.classList.remove("late"); return; }
  const el = Math.floor((Date.now() - classStart) / 1000);
  c.textContent = mmss(Math.min(el, 5999));
  c.classList.toggle("late", el / 60 > SLIDES[cur].min + 4);
  c.title = `Tempo de aula. Planejado para este slide: minuto ${SLIDES[cur].min}. Clique duas vezes para zerar.`;
}, 1000);
document.getElementById("clock").addEventListener("dblclick", ev => { ev.stopPropagation(); classStart = null; });

/* menu de slides */
menuEl.innerHTML = `<h4>Todos os slides</h4><div class="mg">${SLIDES.map((s, i) => `<button data-i="${i}" style="--c:${SEC[s.sec][1]}"><b>${i + 1} · min ${s.min}</b>${s.title}</button>`).join("")}</div>`;
menuEl.addEventListener("click", ev => {
  ev.stopPropagation();
  const b = ev.target.closest("button[data-i]");
  if (b) { menuEl.classList.remove("open"); go(+b.dataset.i); }
});
const toggleMenu = () => menuEl.classList.toggle("open");
const toggleNotes = () => notesEl.classList.toggle("open");
function toggleTheme() {
  const root = document.documentElement;
  const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = dark ? "light" : "dark";
}
function toggleFull() {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen?.().catch(() => {});
  else document.exitFullscreen?.();
}

/* eventos */
const btn = (id, fn) => document.getElementById(id).addEventListener("click", ev => { ev.stopPropagation(); fn(); });
btn("bPrev", prev); btn("bNext", next); btn("bMenu", toggleMenu); btn("bNotes", toggleNotes); btn("bTheme", toggleTheme); btn("bFull", toggleFull);
document.getElementById("hud").addEventListener("click", ev => ev.stopPropagation());
notesEl.addEventListener("click", ev => ev.stopPropagation());

slideEl.addEventListener("click", ev => {
  if (ev.target.closest("a, button, .timer")) return;
  const r = deck.getBoundingClientRect();
  if (ev.clientX - r.left < r.width * 0.2) prev(); else next();
});

document.addEventListener("keydown", ev => {
  if (ev.metaKey || ev.ctrlKey || ev.altKey) return;
  const k = ev.key;
  if (menuEl.classList.contains("open") && k === "Escape") { toggleMenu(); return; }
  if (["ArrowRight", "PageDown", " ", "Enter"].includes(k)) { ev.preventDefault(); next(); }
  else if (["ArrowLeft", "PageUp", "Backspace"].includes(k)) { ev.preventDefault(); prev(); }
  else if (k === "Home") go(0);
  else if (k === "End") go(SLIDES.length - 1);
  else if (k === "n" || k === "N") toggleNotes();
  else if (k === "m" || k === "M") toggleMenu();
  else if (k === "t" || k === "T") toggleTimer();
  else if (k === "r" || k === "R") resetTimer();
  else if (k === "d" || k === "D") toggleTheme();
  else if (k === "f" || k === "F") toggleFull();
});

let tx = null;
slideEl.addEventListener("touchstart", ev => { tx = ev.touches[0].clientX; }, { passive: true });
slideEl.addEventListener("touchend", ev => {
  if (tx === null) return;
  const dx = ev.changedTouches[0].clientX - tx; tx = null;
  if (Math.abs(dx) > 50) { dx < 0 ? next() : prev(); }
}, { passive: true });

function fromHash() {
  const m = /^#s(\d+)$/.exec(location.hash);
  if (m) { const i = +m[1] - 1; if (i !== cur && i >= 0 && i < SLIDES.length) { cur = i; step = 0; render(false); return true; } }
  return false;
}
window.addEventListener("hashchange", fromHash);
window.addEventListener("resize", fit);
fit();
if (!fromHash()) render(false);
})();
</script>
</body>
</html>
